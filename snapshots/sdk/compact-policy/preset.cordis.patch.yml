- insert:
    - id: snapshot-preset-first
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: first
        plugins:
          - id: basic-realm
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.7
                  headroomTokens: 30000
                  retainTokens: 100
                  auto: false
                  modelPolicies:
                    - provider: deepseek-official
                      model: deepseek-v4-flash
                      headroomTokens: 40000
