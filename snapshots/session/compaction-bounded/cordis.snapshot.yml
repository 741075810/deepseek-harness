# Replay uses the same compaction settings with an external-model substitute.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: typert-loader
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js process.cwd() + '/.dsh/sessions'
    compression: none

- id: tool-skill
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: shell-env
  disabled: true

- insert:
    - id: mcp-bounded-history
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: bounded
        command: !!js process.execPath
        args: !!js "[process.getBuiltinModule('node:path').resolve(process.env.DSH_SNAPSHOT_FILE, '../../compaction-bounded/mcp-service.mjs')]"
        failOnStartupError: true
        reconnect:
          enabled: false

- id: system-prompt
  config:
    personaPrefix: |
      You are a coding assistant. Keep ordered evidence and balanced tool history across checkpoints.

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    summarizationProvider: deepseek-official
    summarizationModel: bounded-summary
    maxTokens: 128
    summarizationInputRatio: 0.8
    summarizationMaxCalls: 128

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
              - id: bounded-summary
                contextWindow: 8192
                reasoningEfforts: [high]
                defaultReasoningEffort: high
